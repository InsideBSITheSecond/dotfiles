# Base plugin config
plugin {
    hyprscrolling {
        column_width = 0.5
        explicit_column_widths = '0.333, 0.5, 0.667, 1.0'
        fullscreen_on_one_column = true
        focus_fit_method = 1
        follow_focus = false
    }
}

# Scroll through current workspace
bind = $mainMod, mouse_down, layoutmsg, move -col
bind = $mainMod, mouse_up, layoutmsg, move +col
bind = $mainMod, left, layoutmsg, move -col
bind = $mainMod, right, layoutmsg, move +col

# Move windows left and right
bind = $mainMod SHIFT, left, layoutmsg, swapcol l
bind = $mainMod SHIFT, right, layoutmsg, swapcol r

# Resize focused window
bind = $mainMod SHIFT, up, layoutmsg, colresize +conf
bind = $mainMod SHIFT, down, layoutmsg, colresize -conf

# Misc keys
bind = $mainMod SHIFT, T, layoutmsg, togglefit
