# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
#windowrule = float on, match:class ^(kitty)$,match:title ^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppress_event maximize, match:class .*

# Fix some dragging issues with XWayland
windowrule = no_focus on,match:class ^$,match:title ^$,match:xwayland 1,match:float 1,match:fullscreen 0,match:pin 0

# XWayland only
windowrule = float on, match:xwayland 1
windowrule = border_color rgb(ee1122), match:xwayland 1
#windowrule = border_size 8, match:xwayland 1

#######
# Tags Definition
#######

## Floating & Pinned windows
windowrule {
  name = FloatPin
  match:tag = floatpin

  float = on
  pin = on
}

## Floating windows
windowrule {
  name = Float
  match:tag = float

  float = on
}

# Unfocused rendering windows
windowrule {
  name = BackRender
  match:tag = backrender

  render_unfocused = on
}

windowrule {
  name = VideoGame
  match:tag = game

  float = on
  render_unfocused = on
}
#######
# Assignation
#######

windowrule = tag +floatpin, match:class (org.keepassxc.KeePassXC)
windowrule = tag +floatpin, match:class (unknown)
windowrule = tag +floatpin, match:class (org.pulseaudio.pavucontrol)

windowrule = tag +float, match:class (com.nextcloud.desktopclient.nextcloud)
windowrule = tag +float, match:title (No Title Yet) #EternityCore Sub-Windows

windowrule = tag +game, match:initial_class .*Minecraft.*
windowrule = tag +game, match:initial_class .*New Horizons.*
windowrule = tag +game, match:title ^(WAKFU)


# Dwarf Fortress
windowrule = tag +float +backrender,match:class steam_app_975370
windowrule = size 1920 1080,match:class steam_app_975370

windowrule = tag -float, match:class (discord)

xwayland {
  force_zero_scaling = true
}

#windowrule = size 1920 1040,title:^(WAKFU)
#/windowrule = tag +unfocused, title:^(Unity)$

