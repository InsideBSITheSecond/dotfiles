#windowrule = center, class:(jetbrains-)(.*), initialTitle:(.+), floating:1

# To get more information about a window’s class, title, XWayland status or its size, you can use `hyprctl clients`. (From Hyprland Wiki)
windowrule = float on, match:class ^(one.alynx.showmethekey)$
windowrule = float on, match:class ^(showmethekey-gtk)$ # make window floating
windowrule = pin on, match:class ^(showmethekey-gtk)$ # pin window