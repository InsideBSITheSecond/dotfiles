# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
windowrule = float on, match:class ^(kitty)$,match:title ^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppress_event maximize, match:class .*

# Fix some dragging issues with XWayland
windowrule = no_focus on,match:class ^$,match:title ^$,match:xwayland 1,match:float 1,match:fullscreen 0,match:pin 0

# Pinned & Floating Windows
windowrule {
  name = KeePassXC
  match:class = org.keepassxc.KeePassXC
  match:class = org.pulseaudio.pavucontrol

  float = on
  pin = on
}

#/windowrule = float, class:(org.pulseaudio.pavucontrol)

#/windowrule = float, class:(unknown)

# Dwarf Fortress
windowrule = float on,match:class steam_app_975370
windowrule = size 1920 1080,match:class steam_app_975370



xwayland {
  force_zero_scaling = true
}

#windowrule = float,title:^(WAKFU)
#windowrule = size 1920 1040,title:^(WAKFU)
#/windowrule = tag +unfocused, title:^(Unity)$

# Caveman unfocused tag system
windowrule = tag +unfocused, match:title ^(Minecraft)$
windowrule = render_unfocused on, match:tag unfocused

# IntelliJ
# find in files
#windowrule = noinitialfocus,class:jetbrains-toolbox, floating:1
#windowrule = noinitialfocus, class:(jetbrains-)(.*), title:^$, initialTitle:^$, floating:1
# other dialogs
#windowrule = center, class:(jetbrains-)(.*), title:^$, initialTitle:^$, floating:1
#windowrule = center, class:(jetbrains-)(.*), initialTitle:(.+), floating:1

# To get more information about a window’s class, title, XWayland status or its size, you can use `hyprctl clients`. (From Hyprland Wiki)
windowrule = float on, match:class ^(one.alynx.showmethekey)$
windowrule = float on, match:class ^(showmethekey-gtk)$ # make window floating
windowrule = pin on, match:class ^(showmethekey-gtk)$ # pin window